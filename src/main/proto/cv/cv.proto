syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.htv.proto.cv";

message ExperienceGrpc {
  string company = 1;
  string position = 2;
  string duration = 3;
  repeated string description = 4;
}

message EducationGrpc {
  string school = 1;
  string major = 2;
  string duration = 3;
  string gpa = 4;
}

message ProjectGrpc {
  string id = 1;
  string title = 2;
  string short_desc = 3;
  string full_desc = 4;
  repeated string tech = 5;
  string link = 6;
  string year = 7;
}

message TranslationGrpc {
  string lang_code = 1;

  string name = 10;
  string title = 11;
  string summary = 12;
  string email = 13;
  string phone = 14;
  string location = 15;
  string website = 16;

  repeated ExperienceGrpc experience = 20;
  repeated EducationGrpc education = 21;
  repeated string skills = 22;
  repeated ProjectGrpc projects = 24;
}

message CvGrpc {
  int64 id = 1;
  string default_lang = 2;
  bool is_active = 5;

  repeated TranslationGrpc translations = 10;
}

message GetCvGrpcRequest {
  int64 cv_id = 1;
  string requested_lang = 2;
}

message GetCvGrpcResponse {
  CvGrpc cv = 1;
  TranslationGrpc resolved_translation = 2;
}

message CreateCVRequest {
  CvGrpc cv = 1;
}

message UpdateCVRequest {
  CvGrpc cv = 1;
}

message DeleteCVRequest {
  int64 cv_id = 1;
}

message ListCVsRequest {
  int32 page = 1;
  int32 size = 2;
  string lang = 3;
}

message ListCvsGrpcResponse {
  repeated CvGrpc items = 1;
  int32 total = 2;
}

service CvGrpcService {
  rpc GetCV(GetCvGrpcRequest) returns (GetCvGrpcResponse);
  rpc CreateCV(CreateCVRequest) returns (CvGrpc);
  rpc UpdateCV(UpdateCVRequest) returns (CvGrpc);
  rpc DeleteCV(DeleteCVRequest) returns (CvGrpc);
  rpc ListCVs(ListCVsRequest) returns (ListCvsGrpcResponse);
}