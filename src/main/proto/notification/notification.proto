syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.xxx.notification";


message SendEmailGrpcRequest {
  int64 email_id = 1;
  string email_title = 2;
  string email_to = 3;
  string email_cc = 4;
  string email_bcc = 5;
  string content = 6;
  repeated AttachmentGrpc attachments = 7;
  map<string, string> metadata = 8;
}

message SendTelegramGrpcRequest {
  int64 telegram_id = 1;
  int64 chat_id = 2;
  string title = 3;
  string message = 4;
}

message AttachmentGrpc {
  string file_name = 1;
  string content_type = 2;
  string content_id = 3;
  bytes content = 4;
}

enum PLATFORM_NOTIFICATION {
  PUSH_PLATFORM_UNSPECIFIED = 0;
  PUSH_PLATFORM_IOS = 1;        // APNs
  PUSH_PLATFORM_ANDROID = 2;    // FCM
  PUSH_PLATFORM_WEB = 3;        // Web Push
}

message PushTokenGrpc {
  PLATFORM_NOTIFICATION platform = 1;
  string token = 2;
}

message SendPushNotificationRequest {
  string user_id = 1;
  repeated PushTokenGrpc tokens = 2;
  string title = 3;
}

message PushDeliveryResult {
  PushTokenGrpc token = 1;
  string message_id = 2;
  bool delivered = 3;
  string error = 4;
}